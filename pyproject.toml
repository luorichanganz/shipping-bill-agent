[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "shipping-bill-agent"
version = "0.1.0"
description = "Multi-format shipping bill extraction and reconciliation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "Pillow>=10.0",
  "pycountry>=24.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "xlwt>=1.3",
]

[project.scripts]
shipping-bill-agent = "shipping_bill_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shipping_bill_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["shipping_bill_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

